name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: filecheap-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: Tracked-content privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject workplace-specific references
        run: bash scripts/check-repository-privacy.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

  artifact-contract:
    name: Artifact handoff contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go for the pinned Glyphrun runner
        uses: actions/setup-go@v6
        with:
          # The main test job validates the repository's go.mod version.
          # Glyphrun v0.15.0 requires Go 1.26.
          go-version: '1.26.5'
          cache: true

      - name: Verify CLI and MCP contract surfaces
        run: go test ./internal/artifactref ./internal/fcheap/cli ./internal/mcp

      - name: Verify the installed binary contract
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/fcheap-installed"
          stash_dir="$RUNNER_TEMP/fcheap-installed-stash"
          source_dir="$RUNNER_TEMP/fcheap-installed-source"
          mkdir -p "$install_dir" "$source_dir"
          printf '%s\n' '{"run":"installed-contract"}' > "$source_dir/run.json"
          GOBIN="$install_dir" CGO_ENABLED=0 go install ./cmd/fcheap
          save_json="$("$install_dir/fcheap" --stash-dir "$stash_dir" save "$source_dir" --tool glyphrun --json)"
          stash_id="$(jq -er '.id | select(type == "string" and length > 0)' <<< "$save_json")"
          reference_json="$("$install_dir/fcheap" --stash-dir "$stash_dir" artifact-ref "$stash_id" --producer-tool glyphrun --entrypoint run.json --json)"
          jq -e --arg stash_id "$stash_id" '
            ."$schema" == "urn:filecheap.dev:artifact-ref:v1" and
            .version == 1 and
            .provider == "fcheap-local" and
            .artifact_id == $stash_id
          ' <<< "$reference_json"

      - name: Install pinned Glyphrun runner
        run: go install github.com/abdul-hamid-achik/glyphrun/cmd/glyph@v0.15.0

      - name: Run artifact reference and private recovery binary flows
        shell: bash
        run: |
          "$(go env GOPATH)/bin/glyph" run e2e/flows/cli_artifact_ref.yml --format md
          "$(go env GOPATH)/bin/glyph" run e2e/flows/cli_pull.yml --format md

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7.2

  security:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install locked dependencies
        run: bun ci

      - name: Build and verify docs
        run: bun run docs:verify

      - name: Audit docs build dependencies
        run: bun audit

  platform:
    name: Platform
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: filecheap_test
          POSTGRES_PASSWORD: filecheap-postgres-test-only
          POSTGRES_USER: filecheap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filecheap_test -d filecheap_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install locked dependencies
        run: bun ci

      - name: Install locked docs dependencies
        run: bun ci --cwd docs

      - name: Apply migrations from zero on PostgreSQL
        env:
          FILECHEAP_POSTGRES_TEST_URL: postgresql://filecheap_test:filecheap-postgres-test-only@127.0.0.1:5432/filecheap_test?sslmode=disable
        run: bun run test:postgres

      - name: Check the Drizzle migration graph
        env:
          MIGRATIONS_DATABASE_URL: postgresql://schema-check.invalid/filecheap
        run: bun run db:check

      - name: Verify isolated platform
        run: bun run check

      - name: Build unified public site
        run: bun run build

      - name: Audit platform production dependencies
        run: bun run audit:production

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [privacy, test, artifact-contract, lint, security, docs, platform]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: CGO_ENABLED=0 go build -o fcheap ./cmd/fcheap

      - name: Verify binary
        run: |
          ./fcheap --version
          (cd "$(mktemp -d)" && "$GITHUB_WORKSPACE/fcheap" docs show cli/save) | grep -q '^# save'
