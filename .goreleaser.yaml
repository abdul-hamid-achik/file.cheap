version: 2

project_name: fcheap

before:
  hooks:
    - go mod tidy

builds:
  - id: fcheap
    main: ./cmd/fcheap
    binary: fcheap
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/abdul-hamid-achik/file.cheap/internal/fc/version.Version={{.Version}}
      - -X github.com/abdul-hamid-achik/file.cheap/internal/fc/version.Commit={{.ShortCommit}}
      - -X github.com/abdul-hamid-achik/file.cheap/internal/fc/version.Date={{.Date}}

archives:
  - id: fcheap
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

homebrew_casks:
  - name: fcheap
    binaries:
      - fcheap
    ids:
      - fcheap
    repository:
      owner: abdul-hamid-achik
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://file.cheap"
    description: "Local file processing CLI and MCP server for images, PDFs, and videos"
    caveats: |
      The binary is not signed with an Apple Developer certificate.
      macOS may show a security warning on first run. To fix:

        xattr -d com.apple.quarantine "$(brew --prefix)/Caskroom/fcheap/#{version}/fcheap"

      Or install with: brew install --no-quarantine abdul-hamid-achik/tap/fcheap

nfpms:
  - id: packages
    package_name: fcheap
    vendor: file.cheap
    homepage: https://file.cheap
    maintainer: Abdul Hamid Achik <abdul.achik@gmail.com>
    description: "Local file processing CLI and MCP server for images, PDFs, and videos"
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    recommends:
      - ffmpeg
      - poppler-utils
      - libwebp-tools

release:
  github:
    owner: abdul-hamid-achik
    name: file.cheap
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
