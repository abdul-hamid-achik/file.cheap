version: 2

project_name: fcheap

before:
  hooks:
    - go mod tidy

builds:
  - id: fcheap
    main: ./cmd/fcheap
    binary: fcheap
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/abdul-hamid-achik/file.cheap/internal/fcheap/version.Version={{ .Version }}
      - -X github.com/abdul-hamid-achik/file.cheap/internal/fcheap/version.Commit={{ .Commit }}
      - -X github.com/abdul-hamid-achik/file.cheap/internal/fcheap/version.Date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: fcheap
    ids:
      - fcheap
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

nfpms:
  - id: fcheap
    ids:
      - fcheap
    package_name: fcheap
    vendor: Abdul Hamid Achik
    homepage: "https://github.com/abdul-hamid-achik/file.cheap"
    maintainer: "Abdul Hamid Achik <abdulachik@icloud.com>"
    description: "The local artifact vault for coding agents"
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: utils

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: abdul-hamid-achik
    name: file.cheap
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"

homebrew_casks:
  - name: fcheap
    ids:
      - fcheap
    binaries:
      - fcheap
    repository:
      owner: abdul-hamid-achik
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/abdul-hamid-achik/file.cheap"
    description: "The local artifact vault for coding agents"
    license: "MIT"
    # The canonical tag workflow requires this token before GoReleaser starts.
    # Keep snapshots and fork-local checks usable without upstream tap access.
    skip_upload: "{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/fcheap"]
          end
    caveats: |
      The binary is not signed with an Apple Developer certificate.
      macOS may show a security warning on first run.

      If macOS blocks the first run, clear quarantine manually:
        xattr -dr com.apple.quarantine /opt/homebrew/Caskroom/fcheap/*/fcheap

      Run `fcheap doctor` after installation to check the stash directory.
