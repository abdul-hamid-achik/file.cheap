version: 1
name: cli_save_fail_on_secrets

metadata:
  feature: cli
  owner: core
  priority: high
  tags:
    - smoke
    - secrets

intent: |
  Verify that `fcheap save --fail-on-secrets` refuses a directory that
  contains a likely secret: it prints file, rule, and line (never the value),
  exits with the distinct code 4, and leaves the stash vault empty. A clean
  directory with the same flag still saves normally.

target:
  cmd:
    - "/bin/sh"
    - "-c"
    - |
      export FCHEAP_STASH_DIR=/tmp/fcheap-e2e-stash-failsecrets
      rm -rf /tmp/fcheap-e2e-stash-failsecrets /tmp/fcheap-e2e-secrets-src /tmp/fcheap-e2e-clean-src
      mkdir -p /tmp/fcheap-e2e-secrets-src /tmp/fcheap-e2e-clean-src
      echo "aws_id = AKIAIOSFODNN7EXAMPLE" > /tmp/fcheap-e2e-secrets-src/config.env
      echo "harmless" > /tmp/fcheap-e2e-clean-src/readme.txt
      ./bin/fcheap save /tmp/fcheap-e2e-secrets-src --fail-on-secrets
      echo "BLOCKED_EXIT=$?"
      ./bin/fcheap list
      ./bin/fcheap save /tmp/fcheap-e2e-clean-src --fail-on-secrets
      echo "CLEAN_EXIT=$?"
  cwd: "."
  timeoutMs: 30000

terminal:
  cols: 120
  rows: 40
  profile: xterm-256color
  alternateScreen: forbid

preconditions:
  commands:
    - run: "go build -o ./bin/fcheap ./cmd/fcheap"
      timeoutMs: 120000

imports:
  - ../actions/wait_clean_exit.yml

steps:
  - use: wait_clean_exit

outcomes:
  - id: clean_exit
    description: the wrapper script itself exits successfully
    verify:
      process:
        exitCode: 0
  - id: blocked_with_exit_4
    description: the secret directory is refused with exit code 4
    verify:
      screen:
        contains: "BLOCKED_EXIT=4"
  - id: findings_reported_without_value
    description: file, line, and rule are printed
    verify:
      screen:
        contains: "config.env:1 [aws-access-key]"
  - id: nothing_saved
    description: the vault stayed empty after the refusal
    verify:
      screen:
        contains: "No stashes found"
  - id: clean_directory_saves
    description: a clean directory still saves with the same flag
    verify:
      screen:
        contains: "CLEAN_EXIT=0"
